<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ماشین نارنجی AR</title>
<script>
  // show any loading/script error on screen instead of hanging
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err');
    if (el) el.textContent = 'خطا: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'نامشخص');
  }, true);
  setTimeout(function () {
    var m = document.getElementById('modeInfo');
    var e = document.getElementById('err');
    if (m && m.textContent.indexOf('در حال') === 0 && e && !e.textContent)
      e.textContent = 'اینترنت کنده و بازی هنوز داره لود می‌شه. لطفاً صبر کنید…';
  }, 10000);
</script>
<style>
  :root{
    --orange:#ff6a13; --orange-d:#c94a00; --ink:#14100d; --paper:#fff6ee;
    --glass:rgba(20,16,13,.55); --font:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--font)}
  body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  #video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  #stage{position:fixed;inset:0;z-index:1}
  #stage canvas{display:block;width:100%!important;height:100%!important}
  #overlay{position:fixed;inset:0;z-index:2;pointer-events:none}
  #overlay > *{pointer-events:auto}

  /* start screen */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;
    padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right));text-align:center;
    background:radial-gradient(120% 80% at 50% 110%,#3a1a06 0%,var(--ink) 60%)}
  #start h1{margin:0;font-size:clamp(34px,10vw,56px);font-weight:900;line-height:1.1;color:var(--orange);text-wrap:balance}
  #start p{margin:0;max-width:30ch;line-height:1.8;opacity:.85}
  .carIcon{width:120px;height:60px;position:relative}
  .carIcon:before{content:"";position:absolute;inset:18px 0 12px;background:var(--orange);border-radius:10px 14px 6px 6px}
  .carIcon:after{content:"";position:absolute;left:28px;right:30px;top:2px;height:22px;background:var(--orange-d);border-radius:10px 10px 0 0}
  .carIcon i{position:absolute;bottom:0;width:22px;height:22px;border-radius:50%;background:#222;border:4px solid #555}
  .carIcon i:first-child{left:16px}.carIcon i:last-child{right:16px}
  .btn{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:999px;padding:16px 38px;background:var(--orange);color:#fff;
    box-shadow:0 6px 0 var(--orange-d);cursor:pointer}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .link{background:none;border:0;color:var(--paper);opacity:.7;font:inherit;text-decoration:underline;cursor:pointer}
  #modeInfo{font-size:13px;opacity:.6}
  #err{color:#ffb38a;font-size:14px;max-width:32ch;line-height:1.7}

  /* HUD */
  #hud[hidden],#start[hidden]{display:none!important}
  #hint{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);
    background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px 16px;border-radius:14px;font-size:15px;text-align:center;line-height:1.6}
  #topBtns{position:absolute;top:calc(env(safe-area-inset-top) + 70px);right:max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:10px}
  .small{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:12px;padding:10px 14px;background:var(--glass);color:var(--paper);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #speed{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:max(16px,env(safe-area-inset-left));background:var(--glass);
    padding:8px 12px;border-radius:12px;font-variant-numeric:tabular-nums;font-size:14px;direction:ltr}
  #controls{position:absolute;left:0;right:0;bottom:0;direction:ltr;display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 22px) max(16px,env(safe-area-inset-left));pointer-events:none}
  .pad{display:flex;gap:14px;pointer-events:auto}
  .pad.v{flex-direction:column}
  .ctl{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:var(--glass);color:#fff;font-size:30px;
    display:grid;place-items:center;touch-action:none;font-family:inherit;line-height:1;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .ctl.on{background:var(--orange);border-color:#fff}
  .ctl.gas{width:92px;height:92px}
  #controls.off .pad{opacity:.35;pointer-events:none}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay hidden></video>
<div id="stage"></div>

<div id="overlay">
  <section id="start">
    <div class="carIcon"><i></i><i></i></div>
    <h1>ماشین نارنجی</h1>
    <p>یه ماشین اسباب‌بازی رو بذار روی زمین یا میزت و باهاش رانندگی کن.</p>
    <button class="btn" id="go">شروع</button>
    <button class="link" id="goCam" hidden>حالت دوربین ساده</button>
    <div id="modeInfo">در حال بررسی گوشی…</div>
    <div id="err"></div>
  </section>

  <section id="hud" hidden>
    <div id="hint">گوشی رو آروم سمت زمین بچرخون تا دایره پیدا شه، بعد روی صفحه تپ کن</div>
    <div id="speed">0.0 km/h</div>
    <div id="topBtns">
      <button class="small" id="place">جابه‌جایی ماشین</button>
      <button class="small" id="exit">خروج</button>
    </div>
    <div id="controls" class="off">
      <div class="pad">
        <button class="ctl" data-k="left" aria-label="چپ">◀</button>
        <button class="ctl" data-k="right" aria-label="راست">▶</button>
      </div>
      <div class="pad v">
        <button class="ctl gas" data-k="gas" aria-label="گاز">▲</button>
        <button class="ctl" data-k="rev" aria-label="دنده عقب">▼</button>
      </div>
    </div>
  </section>
</div>

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.01, 60);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a6a, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(1, 3, 2); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, .9); fill.position.set(-2, 1.5, -1); scene.add(fill);

addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;

  renderer.setSize(innerWidth, innerHeight);

function makeVan() {
  const g = new THREE.Group(), v = new THREE.Group(); v.scale.setScalar(SC); g.add(v);
  const M = o => new THREE.MeshStandardMaterial(o);
  const orange = M({ color: ORANGE, roughness: .38, metalness: .1 });
  const navy = M({ color: NAVY, roughness: .7 });
  const dark = M({ color: 0x1d2026, roughness: .8 });
  const tire = M({ color: 0x141414, roughness: .95 });
  const silver = M({ color: 0xd4d8dd, roughness: .3, metalness: .75 });
  const glass = M({ color: 0x1a2633, roughness: .05, metalness: .7 });
  const head = M({ color: 0xfff6d8, emissive: 0xfff0b0, emissiveIntensity: 1 });
  const tail = M({ color: 0xff2020, emissive: 0xcc0000, emissiveIntensity: .6 });
  const white = M({ color: 0xf4f4f4, roughness: .4 });
  const add = (geo, m, x, y, z) => { const b = new THREE.Mesh(geo, m); b.position.set(x, y, z); v.add(b); return b; };
  const box = (w, h, d, m, x, y, z) => add(new THREE.BoxGeometry(w, h, d), m, x, y, z);
  // side profile drawn in (z = forward, y = up), extruded across the width and centered on x = 0
  const profile = (pts, width, m, bevel = 0) => {
    const s = new THREE.Shape(); pts(s);
    const geo = new THREE.ExtrudeGeometry(s, bevel
      ? { depth: width - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 24 }
      : { depth: width, bevelEnabled: false, curveSegments: 24 });
    geo.rotateY(-Math.PI / 2); geo.translate(width / 2 - bevel, 0, 0);
    return add(geo, m, 0, 0, 0);
  };
  const poly = list => s => list.forEach(([z, y], i) => i ? s.lineTo(z, y) : s.moveTo(z, y));
  // flat decal (canvas texture with transparency) laid just above a body panel
  const decal = (w, h, tex, x, y, z, rotY) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), M({ map: tex, transparent: true, roughness: .4, metalness: .05,
      depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 }));
    m.position.set(x, y, z); m.rotation.y = rotY; v.add(m); return m;
  };
  const PX = 400; // decal texture pixels per meter
  const decalTex = (w, h, draw) => canvasTex(Math.round(w * PX), Math.round(h * PX), (x, cw, ch) => { x.scale(cw / w, ch / h); draw(x); });

  const WF = 1.3, WR = -1.25, WY = .3, AR = .38; // wheel centers, arch radius
  const BODY_W = 1.58, BOX_W = 1.78, BV = .05;

  // lower body (doors + bed sides) with wheel-arch cutouts
  const aA = Math.asin((.38 - WY) / AR);
  profile(s => {
    s.moveTo(1.95, .38); s.lineTo(WF + AR * Math.cos(aA), .38);
    s.absarc(WF, WY, AR, aA, Math.PI - aA, false);
    s.lineTo(WR + AR * Math.cos(aA), .38);
    s.absarc(WR, WY, AR, aA, Math.PI - aA, false);
    s.lineTo(-1.95, .38); s.lineTo(-1.95, .9); s.lineTo(1.95, .9); s.lineTo(1.95, .38);
  }, BODY_W, orange);

  // wheel-arch flares (navy)
  for (const zc of [WF, WR]) profile(s => {
    const r0 = AR - .02, r1 = AR + .07, a = aA - .05;
    s.absarc(zc, WY, r1, a, Math.PI - a, false);
    s.lineTo(zc - r0 * Math.cos(a), WY + r0 * Math.sin(a));
    s.absarc(zc, WY, r0, Math.PI - a, a, true);
  }, BODY_W + .1, navy);

  // cab: short hood, raked windshield, roof meets the box's front fairing
  profile(poly([[.2, .88], [1.95, .88], [1.95, .98], [1.32, 1.06], [.88, 1.6], [.2, 1.6]]), BODY_W, orange);
  const wsLen = Math.hypot(.44, .54), wsN = [.54 / wsLen, .44 / wsLen];
  const ws = box(1.42, wsLen - .06, .02, glass, 0, 1.33 + wsN[1] * .012, 1.1 + wsN[0] * .012);
  ws.rotation.x = Math.atan2(-.44, .54);
  profile(poly([[.32, 1.1], [1.2, 1.1], [.86, 1.52], [.32, 1.52]]), BODY_W + .02, glass); // side windows
  box(.07, .14, .18, navy, .84, 1.15, 1.08); box(.07, .14, .18, navy, -.84, 1.15, 1.08);   // mirrors

  // cargo box: tall, rounded edges, overhangs the cab with a curved fairing
  profile(s => {
    s.moveTo(-1.9, .97); s.lineTo(.17, .97); s.lineTo(.17, 1.62); s.lineTo(.92, 1.62);
    s.quadraticCurveTo(.96, 2.18, .6, 2.4); s.lineTo(-1.9, 2.4); s.lineTo(-1.9, .97);
  }, BOX_W, orange, BV);
  const BX = BOX_W / 2 + .003, BZ = -1.95 - .003; // outer faces of the box
  box(BOX_W + .02, .05, 2.0, silver, 0, 1.0, -.9); // aluminium rub strip along the bottom of the box

  // box sides: faint panel line + Persian horizontal logo (reads correctly on both sides)
  const sideTex = decalTex(2.0, 1.4, x => {
    x.strokeStyle = 'rgba(0,0,0,.12)'; x.lineWidth = .012;
    x.beginPath(); x.roundRect(.06, .08, 1.88, 1.26, .05); x.stroke();
    drawLogo(x, LOGO_HORIZONTAL_FA, 1.0, .5, .52); // the SVG's viewBox has padding: artwork is ~1.35 m wide
  });
  decal(2.0, 1.4, sideTex, BX, 1.73, -.85, Math.PI / 2);
  decal(2.0, 1.4, sideTex, -BX, 1.73, -.85, -Math.PI / 2);

  // rear: two box doors with hinges + brandmark, tailgate below
  const rearTex = decalTex(BOX_W, 1.53, x => {
    const w = BOX_W, h = 1.53;
    x.strokeStyle = 'rgba(0,0,0,.28)'; x.lineWidth = .012;
    x.beginPath(); x.roundRect(.1, .1, w - .2, h - .2, .03); x.stroke();
    x.beginPath(); x.moveTo(w / 2, .1); x.lineTo(w / 2, h - .1); x.stroke();
    x.fillStyle = '#c9ced4';
    for (const y of [.25, .75, 1.25]) { x.fillRect(.05, y - .06, .09, .12); x.fillRect(w - .14, y - .06, .09, .12); }
    for (const dx of [-.22, .22]) x.fillRect(w / 2 + dx - .08, .03, .16, .05); // top latches
    x.fillRect(w / 2 - .3, h - .14, .1, .05); x.fillRect(w / 2 + .2, h - .14, .1, .05);
    x.fillStyle = '#2a2d33'; x.fillRect(w / 2 - .12, h - .38, .1, .03); // handle
    drawLogo(x, LOGO_BRANDMARK, w / 2, .62, .52);
  });
  decal(BOX_W, 1.53, rearTex, 0, .92 + 1.53 / 2, BZ, Math.PI);
  const gateTex = decalTex(BODY_W, .52, x => {
    x.strokeStyle = 'rgba(0,0,0,.28)'; x.lineWidth = .012; x.strokeRect(.24, .04, BODY_W - .48, .44);
    x.fillStyle = '#2a2d33'; x.fillRect(BODY_W / 2 - .07, .13, .14, .04);
  });
  decal(BODY_W, .52, gateTex, 0, .64, -1.953, Math.PI);

  // doors: seam, handle and the small horizontal logo (one per side)
  const doorTex = flip => decalTex(.95, .74, x => {
    const X = a => flip ? .95 - a : a;
    x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = .01;
    x.beginPath(); x.moveTo(X(.02), .02); x.lineTo(X(.02), .72); x.stroke();     // rear door seam
    x.fillStyle = '#2a2d33'; x.fillRect(Math.min(X(.1), X(.22)), .2, .12, .03); // handle
    drawLogo(x, LOGO_HORIZONTAL_FA, .5, .4, .24);
  });
  decal(.95, .74, doorTex(true), BODY_W / 2 + .003, .7, .68, Math.PI / 2);   // +x: texture-left is the front
  decal(.95, .74, doorTex(false), -BODY_W / 2 - .003, .7, .68, -Math.PI / 2); // -x: texture-left is the rear

  // bumpers (navy, wrapping the corners), grille, lights, plate
  box(BODY_W + .08, .24, .16, navy, 0, .45, 1.98); box(BODY_W + .08, .24, .16, navy, 0, .45, -1.98);
  for (const sx of [1, -1]) { box(.06, .24, .4, navy, sx * (BODY_W / 2 + .01), .45, 1.82); box(.06, .24, .4, navy, sx * (BODY_W / 2 + .01), .45, -1.82); }
  box(.78, .14, .02, dark, 0, .78, 1.955);
  box(.3, .14, .03, head, .56, .79, 1.955); box(.3, .14, .03, head, -.56, .79, 1.955);
  for (const sx of [1, -1]) {
    box(.16, .24, .03, tail, sx * .69, .74, -1.955);
    box(.16, .1, .03, white, sx * .69, .57, -1.955);
  }
  box(.5, .12, .02, white, 0, .45, -2.065);

  // wheels: black tyres, silver steel rims
  const tireGeo = new THREE.CylinderGeometry(.3, .3, .2, 28); tireGeo.rotateZ(Math.PI / 2);
  const hubGeo = new THREE.CylinderGeometry(.19, .19, .21, 24); hubGeo.rotateZ(Math.PI / 2);
  const capGeo = new THREE.CylinderGeometry(.06, .06, .22, 12); capGeo.rotateZ(Math.PI / 2);
  const spokeMat = M({ color: 0xa9aeb4, roughness: .4, metalness: .6 });
  for (const [x, z] of [[.72, WF], [-.72, WF], [.72, WR], [-.72, WR]]) {
    const pivot = new THREE.Group(); pivot.position.set(x, WY, z);
    const spin = new THREE.Group();
    spin.add(new THREE.Mesh(tireGeo, tire), new THREE.Mesh(hubGeo, silver), new THREE.Mesh(capGeo, dark),
      new THREE.Mesh(new THREE.BoxGeometry(.215, .03, .28), spokeMat));
    pivot.add(spin); v.add(pivot);
    W.list.push(spin); if (z > 0) W.front.push(pivot);
  }

  // soft contact shadow
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 4.8), new THREE.MeshBasicMaterial({
    map: canvasTex(128, 128, (x) => { const gr = x.createRadialGradient(64, 64, 8, 64, 64, 64); gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, 128, 128); }),
    transparent: true, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = .02; v.add(sh);
  return g;
}
const car = makeVan(); car.visible = false; scene.add(car);

// reticle for floor detection
const reticle = new THREE.Mesh(new THREE.RingGeometry(.07, .09, 40).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xff6a13 }));
reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

// ---------- input ----------
const keys = { left: false, right: false, gas: false, rev: false };
document.querySelectorAll('.ctl').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); b.setPointerCapture?.(e.pointerId); };
  const off = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
// stop the phone's long-press gestures (text selection, callout menu) from hijacking held buttons
$('controls').addEventListener('touchstart', e => { if (e.target.closest('.ctl')) e.preventDefault(); }, { passive: false });
$('controls').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('selectstart', e => { if (e.target.closest?.('#hud')) e.preventDefault(); });
document.addEventListener('contextmenu', e => e.preventDefault());
const keyMap = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'gas', w: 'gas', ArrowDown: 'rev', s: 'rev' };
addEventListener('keydown', e => { if (keyMap[e.key]) keys[keyMap[e.key]] = true; });
addEventListener('keyup', e => { if (keyMap[e.key]) keys[keyMap[e.key]] = false; });
// touches on our buttons must not count as AR "select" (tap-to-place)
$('hud').addEventListener('beforexrselect', e => { if (e.target.closest('button')) e.preventDefault(); });

// ---------- driving ----------
const S = { x: 0, y: 0, z: 0, heading: 0, speed: 0, steer: 0, placed: false };
const MAX_F = .9, MAX_R = .35, ACC = 1.1, BRAKE = 2.2, DRAG = .7; // meters/sec
function drive(dt) {
  if (!S.placed) return;
  const t = keys.gas ? 1 : keys.rev ? -1 : 0;
  if (t > 0) S.speed += (S.speed < 0 ? BRAKE : ACC) * dt;
  else if (t < 0) S.speed -= (S.speed > 0 ? BRAKE : ACC * .7) * dt;
  else S.speed -= Math.sign(S.speed) * Math.min(Math.abs(S.speed), DRAG * dt);
  S.speed = Math.max(-MAX_R, Math.min(MAX_F, S.speed));

  const target = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
  S.steer += (target * .55 - S.steer) * Math.min(1, dt * 10);
  S.heading += S.speed * S.steer * 3.2 * dt;
  S.x += Math.sin(S.heading) * S.speed * dt;
  S.z += Math.cos(S.heading) * S.speed * dt;

  car.position.set(S.x, S.y, S.z);
  car.rotation.y = S.heading;
  W.front.forEach(p => p.rotation.y = S.steer);
  W.list.forEach(w => w.rotation.x += S.speed * dt / WHEEL_R);
  $('speed').textContent = (Math.abs(S.speed) * 3.6).toFixed(1) + ' km/h';
}
function placeAt(p) {
  const cam = new THREE.Vector3(); camera.getWorldPosition(cam);
  if (renderer.xr.isPresenting) renderer.xr.getCamera().getWorldPosition(cam);
  S.x = p.x; S.y = p.y; S.z = p.z; S.speed = 0;
  S.heading = Math.atan2(p.x - cam.x, p.z - cam.z); // nose points away from you
  car.position.copy(p); car.rotation.y = S.heading; car.visible = true; S.placed = true;
  $('controls').classList.remove('off');
  $('hint').textContent = 'با دکمه‌ها برون. «جابه‌جایی» ماشین رو میاره جلوی دوربین.';
}

// ---------- mode A: real WebXR AR (Android Chrome) ----------
let hitSource = null, lastHit = null, mode = null;
async function startXR() {
  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: overlay } });
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace('viewer') });
  session.addEventListener('select', () => { if (!S.placed && lastHit) placeAt(lastHit); });
  session.addEventListener('end', () => { hitSource = null; resetToStart(); });
  mode = 'xr'; showHud();
  renderer.setAnimationLoop(loop);
}

// ---------- mode B: camera + gyro (iPhone / no WebXR) ----------
const camQ = new THREE.Quaternion(), tgtQ = new THREE.Quaternion();
const e1 = new THREE.Euler(), qa = new THREE.Quaternion(), qx = new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5));
let hasOri = false;
function onOri(e) {
  if (e.alpha == null) return;
  const r = THREE.MathUtils.degToRad, orient = r(screen.orientation?.angle ?? window.orientation ?? 0);
  e1.set(r(e.beta), r(e.alpha), -r(e.gamma), 'YXZ');
  tgtQ.setFromEuler(e1).multiply(qx).multiply(qa.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient));
  if (!hasOri) { camQ.copy(tgtQ); hasOri = true; }
}
function groundPointAhead() {
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  if (dir.y < -.15) { const t = -camera.position.y / dir.y; if (t < 4) return camera.position.clone().addScaledVector(dir, t).setY(0); }
  dir.y = 0; dir.normalize();
  return camera.position.clone().addScaledVector(dir, 1.2).setY(0);
}
let stream = null;
async function startCam() {
  const oriP = (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission)
    ? DeviceOrientationEvent.requestPermission().catch(() => 'denied') : Promise.resolve('granted');
  const camP = navigator.mediaDevices?.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  const [ori] = await Promise.all([oriP, camP.then(s => { stream = s; })]);
  video.srcObject = stream; video.hidden = false; await video.play().catch(() => {});
  if (ori === 'granted') addEventListener('deviceorientation', onOri);
  camera.position.set(0, 1.1, 0);
  camera.quaternion.setFromEuler(new THREE.Euler(-.6, 0, 0)); camQ.copy(camera.quaternion);
  mode = 'cam'; showHud();
  $('hint').textContent = 'گوشی رو سمت زمین بگیر و «جابه‌جایی ماشین» رو بزن';
  setTimeout(() => { if (!S.placed) { camera.quaternion.copy(camQ); placeAt(groundPointAhead()); } }, 700);
  renderer.setAnimationLoop(loop);
}

// ---------- loop ----------
let last = 0;
function loop(t, frame) {
  const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  if (mode === 'xr' && frame && hitSource) {
    const hits = frame.getHitTestResults(hitSource);
    if (hits.length) {
      const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
      reticle.matrix.fromArray(pose.transform.matrix);
      lastHit = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
      reticle.visible = !S.placed;
      if (!S.placed) $('hint').textContent = 'سطح پیدا شد! روی صفحه تپ کن تا ماشین بیاد';
    } else { reticle.visible = false; lastHit = null; }
  }
  if (mode === 'cam' && hasOri) { camQ.slerp(tgtQ, .35); camera.quaternion.copy(camQ); }
  drive(dt);
  renderer.render(scene, camera);
}

// ---------- UI wiring ----------
function showHud() { $('start').hidden = true; $('hud').hidden = false; }
function resetToStart() {
  renderer.setAnimationLoop(null);
  stream?.getTracks().forEach(t => t.stop()); stream = null; video.hidden = true;
  removeEventListener('deviceorientation', onOri); hasOri = false;
  S.placed = false; car.visible = false; reticle.visible = false; mode = null;
  $('controls').classList.add('off'); $('hud').hidden = true; $('start').hidden = false;
  $('hint').textContent = 'گوشی رو آروم سمت زمین بچرخون تا دایره پیدا شه، بعد روی صفحه تپ کن';
}
$('place').addEventListener('click', () => {
  if (mode === 'xr') { if (lastHit) placeAt(lastHit); else { S.placed = false; car.visible = false; $('hint').textContent = 'گوشی رو سمت زمین بگیر تا دایره پیدا شه'; } }
  else placeAt(groundPointAhead());
});
$('exit').addEventListener('click', () => { if (mode === 'xr') renderer.xr.getSession()?.end(); else resetToStart(); });

const fail = err => { console.error(err); $('err').textContent = 'شروع نشد: ' + (err?.message || err) + ' — اجازه دوربین رو بده و دوباره امتحان کن.'; };
let xrOK = false;
(async () => {
  try { xrOK = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch { xrOK = false; }
  $('modeInfo').textContent = xrOK ? 'حالت: AR واقعی (WebXR) با تشخیص سطح' : 'حالت: دوربین + ژیروسکوپ (این مرورگر WebXR نداره)';
  $('goCam').hidden = !xrOK;
})();
// #preview: look at the van on a plain background (desktop testing, no camera)
if (location.hash.startsWith('#preview')) {
  scene.background = new THREE.Color(0xd8d2cc);
  showHud(); mode = 'preview';
  // #preview = rear three-quarter view like the reference photo, #preview-front = front three-quarter
  if (location.hash === '#preview-front') camera.position.set(.32, .14, -.3); else camera.position.set(-.3, .15, .3);
  camera.lookAt(0, .08, 0);
  placeAt(new THREE.Vector3(0, 0, 0)); S.heading = Math.PI / 2; car.rotation.y = S.heading;
  renderer.setAnimationLoop(loop);
}
$('go').addEventListener('click', () => { $('err').textContent = ''; (xrOK ? startXR() : startCam()).catch(fail); });
$('goCam').addEventListener('click', () => { $('err').textContent = ''; startCam().catch(fail); });
</script>
